android {
    signingConfigs {
        release {
            storeFile file('E:\\AndroidProject\\pigeon\\keys\\key0')
            storePassword '123456'
            keyAlias 'key0'
            keyPassword '123456'
        }
    }
    namespace = 'bd.jibon.apps.pigeon'
    compileSdk {
        version = release(37)
    }

    defaultConfig {
        applicationId = "bd.jibon.apps.pigeon"
        minSdk = 26
        targetSdk 37
        versionCode = 20
        versionName = '2.0'
